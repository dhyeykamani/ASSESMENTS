<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Bio-Stack Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Tailwind Custom Configuration for smooth dark mode transitions
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        /* Smooth transitions for theme switching */
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased font-sans">

    <header class="w-full max-w-5xl mx-auto px-4 py-4 flex justify-between items-center border-b border-slate-200 dark:border-slate-800">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-indigo-600 dark:text-indigo-400 text-xl"></i>
            <h1 class="text-xl font-bold tracking-tight">Bio-<span class="text-indigo-600 dark:text-indigo-400">Stack</span></h1>
        </div>
        <button id="themeToggle" class="p-2.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:scale-105 transition-transform" aria-label="Toggle Theme">
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:inline"></i>
        </button>
    </header>

    <main class="w-full max-w-5xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-8 mt-6">
        
        <section class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 h-fit">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-gear text-slate-400"></i> Manage Bio Links
            </h2>
            
            <form id="linkForm" class="space-y-4" novalidate>
                <div>
                    <label for="linkTitle" class="block text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Link Title</label>
                    <input type="text" id="linkTitle" placeholder="e.g., Follow my Twitter" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                </div>
                <div>
                    <label for="linkUrl" class="block text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">URL</label>
                    <input type="url" id="linkUrl" placeholder="https://twitter.com/username" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                </div>
                
                <div id="errorMessage" class="hidden text-sm text-red-500 bg-red-50 dark:bg-red-950/30 p-3 rounded-xl border border-red-200 dark:border-red-900/50 flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="errorText"></span>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm shadow-indigo-200 dark:shadow-none transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Link
                </button>
            </form>

            <hr class="my-6 border-slate-200 dark:border-slate-800">

            <h3 class="text-sm font-semibold mb-3 text-slate-500 dark:text-slate-400 uppercase tracking-wider">Active Link Stack</h3>
            <div id="adminLinkList" class="space-y-2 max-h-[300px] overflow-y-auto pr-1">
                </div>
        </section>

        <section class="flex flex-col items-center justify-start py-4">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2 block"><i class="fa-solid fa-eye"></i> Live Mobile Preview</span>
            
            <div class="w-[340px] min-h-[600px] border-[10px] border-slate-800 dark:border-slate-800 rounded-[40px] shadow-2xl overflow-hidden bg-white dark:bg-slate-900 relative flex flex-col items-center p-6 text-center">
                
                <div class="w-32 h-4 bg-slate-800 absolute top-0 rounded-b-xl"></div>
                
                <div class="w-20 h-20 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-full mt-6 flex items-center justify-center text-white text-3xl font-bold shadow-md">
                    🚀
                </div>
                
                <h3 class="font-bold text-lg mt-3 text-slate-900 dark:text-white">@YourCreativeSpace</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-[240px]">Welcome to my stack! Check out my verified updates and latest projects below.</p>
                
                <div id="livePreviewContainer" class="w-full space-y-3 mt-8 overflow-y-auto max-h-[340px] px-1">
                    </div>

                <div class="mt-auto pt-4">
                    <span class="text-[10px] font-bold text-slate-300 dark:text-slate-700 tracking-widest uppercase">Powered by Bio-Stack</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        // State Engine Data Structure Configuration
        let appState = {
            theme: 'light',
            links: []
        };

        // DOM Element Cache Selectors
        const themeToggleBtn = document.getElementById('themeToggle');
        const linkForm = document.getElementById('linkForm');
        const linkTitleInput = document.getElementById('linkTitle');
        const linkUrlInput = document.getElementById('linkUrl');
        const errorMessageDiv = document.getElementById('errorMessage');
        const errorTextSpan = document.getElementById('errorText');
        const adminLinkList = document.getElementById('adminLinkList');
        const livePreviewContainer = document.getElementById('livePreviewContainer');

        // Initializer Event Bootstrapper Hook
        document.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
            applyTheme();
            renderUI();
            
            // Event Listeners Registration
            themeToggleBtn.addEventListener('click', toggleTheme);
            linkForm.addEventListener('submit', handleAddLink);
        });

        // Local Storage Sync Engine
        function loadSavedData() {
            const savedTheme = localStorage.getItem('biostack_theme');
            const savedLinks = localStorage.getItem('biostack_links');
            
            if (savedTheme) {
                appState.theme = savedTheme;
            } else {
                // Media query checking system preference default fallback
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    appState.theme = 'dark';
                }
            }

            if (savedLinks) {
                try {
                    appState.links = JSON.parse(savedLinks);
                } catch (e) {
                    appState.links = [];
                }
            }
        }

        function saveDataToStorage() {
            localStorage.setItem('biostack_theme', appState.theme);
            localStorage.setItem('biostack_links', JSON.stringify(appState.links));
        }

        // Themes Feature Engine Handler
        function toggleTheme() {
            appState.theme = appState.theme === 'light' ? 'dark' : 'light';
            applyTheme();
            saveDataToStorage();
        }

        function applyTheme() {
            if (appState.theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // Rigorous Robust URL Validation Engine Utility regex
        function isValidUrl(string) {
            try {
                // Strict validation using native URL parsing object checks
                const url = new URL(string);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;  
            }
        }

        // Event handler routing link addition process routines
        function handleAddLink(e) {
            e.preventDefault();
            
            const title = linkTitleInput.value.trim();
            let url = linkUrlInput.value.trim();

            // Clear previous errors safely
            hideError();

            // Validation Rules Check 1: Empty Fields Check
            if (!title || !url) {
                showError("Please completely populate both Title and URL parameters.");
                return;
            }

            // Standardize URL: Automatically prefix protocol string schema headers if missing completely
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            // Validation Rules Check 2: Structural Format Regex verification
            if (!isValidUrl(url)) {
                showError("Invalid structural URL Format pattern string detected.");
                return;
            }

            // Push object to structure array collection
            const newLink = {
                id: Date.now().toString(), // Generate reliable short timestamp tracking id string keys
                title: title,
                url: url
            };

            appState.links.push(newLink);
            saveDataToStorage();
            renderUI();

            // Form Fields State Sanitization Cleanup Resets
            linkForm.reset();
            linkTitleInput.focus();
        }

        // Functional Dynamic Delete handler logic routines
        window.deleteLink = function(id) {
            appState.links = appState.links.filter(link => link.id !== id);
            saveDataToStorage();
            renderUI();
        };

        // DOM Rendering Presentation View Model Engine Updating Interface components synchronously
        function renderUI() {
            renderAdminView();
            renderPreviewMobileView();
        }

        // Dynamic Construction Render for Backend Control block tracking list matrix templates
        function renderAdminView() {
            if (appState.links.length === 0) {
                adminLinkList.innerHTML = `
                    <div class="text-center py-6 text-sm text-slate-400 dark:text-slate-500 italic">
                        No active items configured in this collection structure grid stack.
                    </div>`;
                return;
            }

            adminLinkList.innerHTML = appState.links.map(link => `
                <div class="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 rounded-xl group transition-all">
                    <div class="overflow-hidden pr-2">
                        <h4 class="text-sm font-medium text-slate-800 dark:text-slate-200 truncate">${escapeHTML(link.title)}</h4>
                        <p class="text-xs text-indigo-600 dark:text-indigo-400 truncate">${escapeHTML(link.url)}</p>
                    </div>
                    <button onclick="deleteLink('${link.id}')" class="p-2 text-slate-400 hover:text-red-500 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors" title="Delete Link">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                </div>
            `).join('');
        }

        // Real-Time Virtual Container Layout Node injection matching mobile structural outputs 
        function renderPreviewMobileView() {
            if (appState.links.length === 0) {
                livePreviewContainer.innerHTML = `
                    <div class="text-center py-12 text-xs text-slate-400 dark:text-slate-500 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl p-4">
                        Your added profile links will safely output interactive stack paths live here!
                    </div>`;
                return;
            }

            livePreviewContainer.innerHTML = appState.links.map(link => `
                <a href="${escapeHTML(link.url)}" target="_blank" rel="noopener noreferrer" 
                   class="w-full p-3 block text-sm font-medium rounded-xl text-slate-800 dark:text-white bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700/80 border border-slate-200 dark:border-slate-700/60 transform hover:-translate-y-0.5 active:translate-y-0 transition-all text-center truncate shadow-sm">
                    ${escapeHTML(link.title)}
                </a>
            `).join('');
        }

        // Sanitization Layer Helper mapping preventing script attacks payload parsing
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function showError(message) {
            errorTextSpan.textContent = message;
            errorMessageDiv.classList.remove('hidden');
        }

        function hideError() {
            errorMessageDiv.classList.add('hidden');
            errorTextSpan.textContent = '';
        }
    </script>
</body>
</html>
